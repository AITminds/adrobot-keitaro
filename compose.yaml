services:
  web:
    build: .
    ports:
      - "127.0.0.1:8765:8000"
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-sqlite:////app/data/adrobot.db}
      DEMO_DATABASE_URL: sqlite:////app/data/demo-keitaro.db
    volumes:
      - adrobot-data:/app/data
    restart: unless-stopped

volumes:
  adrobot-data:
