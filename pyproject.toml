[project]
name = "adrobot"
version = "1.0.0"
description = "Keitaro campaign creator and persistent offer editor"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pycountry>=24.6",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
